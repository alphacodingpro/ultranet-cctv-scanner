name: Build mobile apps
on:
  workflow_dispatch:
  push:
    paths: ["mobile/**", ".github/workflows/mobile-build.yml"]
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter create --platforms=android --org com.ultranetsecurity .
      - run: dart run tool/configure_native.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: {name: ultranet-cctv-scanner-android, path: mobile/build/app/outputs/flutter-apk/app-release.apk}
  ios:
    runs-on: macos-latest
    defaults: {run: {working-directory: mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter create --platforms=ios --org com.ultranetsecurity .
      - run: dart run tool/configure_native.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build ios --release --no-codesign
